<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Poçtagram</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal-dark:   #075E54;
      --teal-mid:    #128C7E;
      --green:       #25D366;
      --green-light: #DCF8C6;
      --bg:          #ECE5DD;
      --white:       #FFFFFF;
      --gray-light:  #F0F0F0;
      --gray-mid:    #C4C4C4;
      --gray-dark:   #667781;
      --text:        #111B21;
      --bubble-out:  #D9FDD3;
      --bubble-in:   #FFFFFF;
      --online:      #25D366;
      --shadow:      rgba(0,0,0,.12);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html, body { height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg); color: var(--text); }

    /* ===== SCREENS ===== */
    .screen { display: none; height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }

    /* ===== AUTH SCREENS ===== */
    #screen-auth {
      background: linear-gradient(160deg, var(--teal-dark) 0%, var(--teal-mid) 50%, #1a1a2e 100%);
      align-items: center; justify-content: center; padding: 24px;
    }
    .auth-card {
      background: var(--white); border-radius: 20px; padding: 36px 28px;
      width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo svg { width: 64px; height: 64px; }
    .auth-logo h1 { font-size: 26px; font-weight: 700; color: var(--teal-dark); margin-top: 8px; letter-spacing: -.5px; }
    .auth-logo p { font-size: 13px; color: var(--gray-dark); margin-top: 4px; }
    .tab-row { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--gray-mid); margin-bottom: 24px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--gray-dark); transition: all .2s; }
    .tab-btn.active { background: var(--teal-dark); color: var(--white); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-dark); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
    .form-group input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--gray-mid);
      border-radius: 10px; font-size: 15px; outline: none; transition: border-color .2s;
      font-family: var(--font);
    }
    .form-group input:focus { border-color: var(--teal-mid); }
    .btn-primary {
      width: 100%; padding: 14px; background: var(--green); border: none;
      border-radius: 12px; font-size: 16px; font-weight: 700; color: var(--white);
      cursor: pointer; transition: background .2s; margin-top: 4px;
    }
    .btn-primary:hover { background: #22c35e; }
    .btn-primary:active { transform: scale(.98); }
    .auth-msg { font-size: 13px; text-align: center; margin-top: 14px; min-height: 18px; }
    .auth-msg.error { color: #e74c3c; }
    .auth-msg.success { color: var(--teal-mid); }

    /* ===== APP LAYOUT ===== */
    #screen-app { flex-direction: row; overflow: hidden; }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 100%; max-width: 380px; background: var(--white);
      display: flex; flex-direction: column; border-right: 1px solid #e0e0e0;
      height: 100vh;
    }
    .sidebar-header {
      background: var(--teal-dark); color: var(--white);
      padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between;
      min-height: 56px;
    }
    .sidebar-header h2 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      background: none; border: none; color: rgba(255,255,255,.85); cursor: pointer;
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; transition: background .15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.15); }
    .search-box { padding: 8px 12px; background: var(--gray-light); }
    .search-box input {
      width: 100%; padding: 8px 14px 8px 36px; background: var(--white);
      border: none; border-radius: 20px; font-size: 14px; outline: none;
      font-family: var(--font); color: var(--text);
    }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--gray-dark); }
    .contacts-list { flex: 1; overflow-y: auto; }
    .contacts-list::-webkit-scrollbar { width: 4px; }
    .contacts-list::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 4px; }
    .contact-item {
      display: flex; align-items: center; padding: 10px 16px;
      cursor: pointer; transition: background .15s; border-bottom: 1px solid #f5f5f5;
      gap: 12px;
    }
    .contact-item:hover { background: var(--gray-light); }
    .contact-item.active { background: #EDF2F7; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 20px;
      font-weight: 700; color: var(--white); flex-shrink: 0; position: relative;
    }
    .avatar-sm { width: 36px; height: 36px; font-size: 14px; }
    .online-dot {
      position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px;
      background: var(--online); border: 2px solid var(--white); border-radius: 50%;
    }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-last { font-size: 13px; color: var(--gray-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .contact-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .contact-time { font-size: 11px; color: var(--gray-dark); }
    .unread-badge {
      background: var(--green); color: var(--white); border-radius: 50%;
      width: 20px; height: 20px; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .empty-contacts { padding: 40px 20px; text-align: center; color: var(--gray-dark); }
    .empty-contacts svg { width: 64px; height: 64px; margin-bottom: 12px; opacity: .4; }
    .empty-contacts p { font-size: 14px; }

    /* ===== CHAT AREA ===== */
    #chat-area {
      flex: 1; display: flex; flex-direction: column; height: 100vh;
      background: var(--bg); position: relative;
    }
    .chat-bg {
      position: absolute; inset: 0; opacity: .06; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .chat-header {
      background: var(--teal-dark); color: var(--white); padding: 10px 16px;
      display: flex; align-items: center; gap: 12px; min-height: 56px; z-index: 10;
      box-shadow: 0 1px 3px var(--shadow);
    }
    .chat-header-info { flex: 1; }
    .chat-header-info h3 { font-size: 16px; font-weight: 600; }
    .chat-header-info span { font-size: 12px; color: rgba(255,255,255,.75); }
    .back-btn { background: none; border: none; color: var(--white); cursor: pointer; display: none; padding: 4px; }
    .messages-wrap { flex: 1; overflow-y: auto; padding: 12px 16px; z-index: 1; }
    .messages-wrap::-webkit-scrollbar { width: 4px; }
    .messages-wrap::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 4px; }
    .msg-group { margin-bottom: 2px; }
    .msg-bubble {
      max-width: 72%; padding: 7px 10px 4px; border-radius: 8px; position: relative;
      display: inline-block; word-break: break-word; font-size: 14.5px; line-height: 1.4;
      box-shadow: 0 1px 2px var(--shadow);
    }
    .msg-out { text-align: right; margin-bottom: 2px; }
    .msg-in  { text-align: left;  margin-bottom: 2px; }
    .msg-out .msg-bubble  { background: var(--bubble-out); border-bottom-right-radius: 2px; }
    .msg-in  .msg-bubble  { background: var(--bubble-in);  border-bottom-left-radius: 2px; }
    .msg-meta { font-size: 11px; color: var(--gray-dark); margin-top: 2px; display: flex; align-items: center; justify-content: flex-end; gap: 3px; }
    .msg-in .msg-meta { justify-content: flex-end; }
    .tick { display: inline-flex; }
    .tick svg { width: 16px; height: 16px; }
    .date-divider { text-align: center; margin: 12px 0; }
    .date-divider span { background: rgba(255,255,255,.75); padding: 4px 12px; border-radius: 20px; font-size: 12px; color: var(--gray-dark); box-shadow: 0 1px 2px var(--shadow); }
    .typing-indicator { padding: 4px 16px 8px; font-size: 12px; color: var(--gray-dark); height: 24px; }
    .chat-input-row {
      background: var(--gray-light); padding: 8px 12px; display: flex; align-items: center;
      gap: 8px; z-index: 10; border-top: 1px solid #e0e0e0;
    }
    .msg-input {
      flex: 1; padding: 10px 14px; background: var(--white); border: none;
      border-radius: 22px; font-size: 15px; outline: none; resize: none;
      font-family: var(--font); max-height: 120px; overflow-y: auto;
      line-height: 1.4;
    }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--teal-mid); border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--white); transition: background .15s; flex-shrink: 0;
    }
    .send-btn:hover { background: var(--teal-dark); }
    .send-btn:active { transform: scale(.9); }
    .no-chat-selected {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: var(--gray-dark); gap: 16px;
    }
    .no-chat-selected svg { width: 80px; height: 80px; opacity: .3; }
    .no-chat-selected h3 { font-size: 20px; font-weight: 300; color: #41525D; }
    .no-chat-selected p  { font-size: 14px; color: var(--gray-dark); }

    /* ===== PROFILE PANEL ===== */
    #profile-panel {
      position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100;
      display: none; align-items: flex-end; justify-content: center;
    }
    #profile-panel.show { display: flex; }
    .profile-card {
      background: var(--white); border-radius: 20px 20px 0 0; width: 100%;
      max-width: 480px; padding: 28px 24px 36px; animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .profile-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .profile-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .profile-avatar { width: 64px; height: 64px; border-radius: 50%; font-size: 26px; font-weight: 700; color: var(--white); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .profile-details h4 { font-size: 18px; font-weight: 700; }
    .profile-details p { font-size: 14px; color: var(--gray-dark); margin-top: 2px; }
    .btn-logout {
      width: 100%; padding: 13px; background: #e74c3c; border: none;
      border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--white);
      cursor: pointer; margin-top: 8px; transition: background .2s;
    }
    .btn-logout:hover { background: #c0392b; }
    .close-panel { position: absolute; top: 20px; right: 20px; background: none; border: none; cursor: pointer; color: var(--gray-dark); }

    /* ===== TOAST ===== */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #333; color: var(--white); padding: 10px 20px; border-radius: 20px;
      font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ===== LOADING ===== */
    .loader { border: 3px solid rgba(255,255,255,.3); border-top-color: var(--white); border-radius: 50%; width: 22px; height: 22px; animation: spin .7s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== MOBILE RESPONSIVE ===== */
    @media (max-width: 700px) {
      #sidebar { max-width: 100%; border-right: none; }
      #chat-area { position: fixed; inset: 0; transform: translateX(100%); transition: transform .25s ease; z-index: 50; }
      #chat-area.mobile-open { transform: translateX(0); }
      .back-btn { display: flex !important; }
    }
  </style>
</head>
<body>

<!-- ========== AUTH SCREEN ========== -->
<div class="screen active" id="screen-auth">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="32" fill="#075E54"/>
        <path d="M32 10C20.95 10 12 18.95 12 30C12 33.8 13.08 37.34 14.95 40.34L12 52L23.95 49.12C26.82 50.67 30.3 51.6 34 51.6C45.05 51.6 54 42.65 54 31.6C54 20.55 45.05 10 32 10Z" fill="#25D366"/>
        <path d="M44 38.2C43.5 39.5 41.8 40.6 40.3 40.9C39.3 41.1 37.9 41.3 33.2 39.4C27.2 36.9 23.3 30.8 23 30.4C22.7 30 20.6 27.2 20.6 24.3C20.6 21.4 22.1 20 22.7 19.3C23.3 18.6 24 18.5 24.4 18.5C24.8 18.5 25.2 18.5 25.5 18.5C25.9 18.5 26.4 18.4 26.9 19.5C27.4 20.6 28.6 23.5 28.7 23.7C28.9 23.9 29 24.2 28.8 24.5C28.6 24.8 28.5 25 28.3 25.2C28.1 25.4 27.8 25.7 27.6 25.9C27.4 26.1 27.2 26.4 27.4 26.8C27.6 27.2 28.6 28.8 30 30C31.8 31.6 33.3 32.1 33.7 32.3C34.1 32.5 34.4 32.5 34.6 32.2C34.8 31.9 35.8 30.8 36.1 30.4C36.4 30 36.7 30.1 37.1 30.2C37.5 30.3 40.4 31.7 40.8 31.9C41.2 32.1 41.5 32.2 41.6 32.4C41.7 32.7 41.7 34 41.1 35.5C40.5 37 37.3 38.6 36.4 38.7C35.5 38.8 34.7 39.1 31.2 37.8C26.3 36 23.2 31 22.9 30.6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h1>Poçtagram</h1>
      <p>Hızlı ve güvenli mesajlaşma</p>
    </div>
    <div class="tab-row">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Giriş Yap</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Kayıt Ol</button>
    </div>

    <!-- Login Form -->
    <div id="form-login">
      <div class="form-group">
        <label>E-posta</label>
        <input type="email" id="login-email" placeholder="ornek@mail.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-primary" id="btn-login" onclick="handleLogin()">Giriş Yap</button>
    </div>

    <!-- Register Form -->
    <div id="form-register" style="display:none">
      <div class="form-group">
        <label>İsim</label>
        <input type="text" id="reg-name" placeholder="Adın Soyadın" autocomplete="name" />
      </div>
      <div class="form-group">
        <label>E-posta</label>
        <input type="email" id="reg-email" placeholder="ornek@mail.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="reg-pass" placeholder="En az 6 karakter" autocomplete="new-password" />
      </div>
      <button class="btn-primary" id="btn-register" onclick="handleRegister()">Kayıt Ol</button>
    </div>

    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<!-- ========== APP SCREEN ========== -->
<div class="screen" id="screen-app">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>Poçtagram</h2>
      <div class="header-actions">
        <button class="icon-btn" title="Profil" onclick="openProfile()">
          <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        </button>
      </div>
    </div>
    <div class="search-box">
      <div class="search-wrap">
        <svg width="16" height="16" fill="none" stroke="#667781" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="İsimle kullanıcı ara..." oninput="handleSearch()" />
      </div>
    </div>
    <div class="contacts-list" id="contacts-list">
      <div class="empty-contacts">
        <svg fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <p>Arama yaparak kullanıcı bulabilirsiniz</p>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div id="chat-area">
    <div class="no-chat-selected" id="no-chat">
      <svg fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <h3>Poçtagram Web</h3>
      <p>Mesajlaşmak için bir kullanıcı seçin</p>
    </div>

    <div id="active-chat" style="display:none; flex-direction:column; height:100%; position:relative;">
      <div class="chat-bg"></div>
      <div class="chat-header">
        <button class="back-btn icon-btn" onclick="closeChatMobile()">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="avatar avatar-sm" id="chat-header-avatar"></div>
        <div class="chat-header-info">
          <h3 id="chat-header-name">–</h3>
          <span id="chat-header-status">–</span>
        </div>
      </div>
      <div class="messages-wrap" id="messages-wrap"></div>
      <div class="typing-indicator" id="typing-indicator"></div>
      <div class="chat-input-row">
        <textarea class="msg-input" id="msg-input" placeholder="Mesaj yaz..." rows="1"
          onkeydown="handleInputKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" onclick="sendMessage()">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ========== PROFILE PANEL ========== -->
<div id="profile-panel" onclick="closeProfileOutside(event)">
  <div class="profile-card" style="position:relative;">
    <button class="close-panel icon-btn" onclick="closeProfile()">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <h3>Profilim</h3>
    <div class="profile-row">
      <div class="profile-avatar" id="profile-avatar-big"></div>
      <div class="profile-details">
        <h4 id="profile-name-big">–</h4>
        <p id="profile-email-big">–</p>
      </div>
    </div>
    <button class="btn-logout" onclick="handleLogout()">Çıkış Yap</button>
  </div>
</div>

<!-- ========== TOAST ========== -->
<div id="toast"></div>

<!-- ========== AUDIO ========== -->
<audio id="snd-send"    src="data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YTAAAAB/f39/gICAgH9/f39/f39/gH+AgH+Af4CAgICAgICAgICAf39/f39/f4A=" preload="auto"></audio>
<audio id="snd-receive" src="data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YTAAAAB/gICAgH9/f4CAgH9/gICAgH+Af4CAgICAgICAgICAf39/f39/f4A=" preload="auto"></audio>

<script>
// ============================================================
//  CONFIG  –  JSONBin.io
// ============================================================
// JSONBin ücretsiz tier: 10.000 istek/ay
// BIN_ID'yi oluşturduktan sonra buraya yazın.
// İlk çalıştırmada otomatik oluşturmaya çalışacak.
const JSONBIN_BASE = 'https://api.jsonbin.io/v3';
const JSONBIN_KEY  = '$2a$10$xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'; // <-- API Key buraya

// Eğer API key yoksa LOCAL_MODE=true ile localStorage kullanır
const LOCAL_MODE   = !JSONBIN_KEY.includes('xxxxx');

let USERS_BIN_ID   = localStorage.getItem('poctagram_users_bin')   || null;
let MESSAGES_BIN_ID= localStorage.getItem('poctagram_msgs_bin')    || null;

// ============================================================
//  STATE
// ============================================================
let currentUser     = JSON.parse(localStorage.getItem('poctagram_me') || 'null');
let activeContact   = null;
let allUsers        = {};
let allMessages     = {};
let pollInterval    = null;
let lastMsgCount    = 0;
let searchResults   = [];

// ============================================================
//  SOUNDS  (Web Audio API – fallback synth)
// ============================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;

function ensureAudio() {
  if (!ctx) ctx = new AudioCtx();
}

function playSend() {
  try {
    ensureAudio();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.06);
    g.gain.setValueAtTime(0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    o.start(); o.stop(ctx.currentTime + 0.13);
  } catch(e) {}
}

function playReceive() {
  try {
    ensureAudio();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(660, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.05);
    o.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    o.start(); o.stop(ctx.currentTime + 0.21);
  } catch(e) {}
}

// ============================================================
//  DATA LAYER (JSONBin or localStorage fallback)
// ============================================================
async function loadData(key, binIdKey) {
  const stored = localStorage.getItem('poctagram_' + key);
  return stored ? JSON.parse(stored) : {};
}

async function saveData(key, data) {
  localStorage.setItem('poctagram_' + key, JSON.stringify(data));
}

// ============================================================
//  UTILITIES
// ============================================================
const COLORS = ['#075E54','#128C7E','#25D366','#34B7F1','#FF6B6B','#9B59B6','#E67E22','#E74C3C'];
function avatarColor(name) { let h=0; for(let c of name) h=(h*31+c.charCodeAt(0))%COLORS.length; return COLORS[h]; }
function initials(name) { return name.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }
function fmtTime(ts) { const d=new Date(ts); return d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(ts) {
  const d=new Date(ts), now=new Date();
  if(d.toDateString()===now.toDateString()) return 'Bugün';
  const y=new Date(now); y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString()) return 'Dün';
  return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
}

function showToast(msg, dur=2200) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}

function setAuthMsg(msg, type='') {
  const el=document.getElementById('auth-msg');
  el.textContent=msg; el.className='auth-msg '+type;
}

function hashPass(p) {
  let h=5381; for(let c of p) h=((h<<5)+h)+c.charCodeAt(0)|0;
  return h.toString(36);
}

// ============================================================
//  TAB SWITCH
// ============================================================
function switchTab(tab) {
  document.getElementById('form-login').style.display    = tab==='login'    ? '' : 'none';
  document.getElementById('form-register').style.display = tab==='register' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active',    tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  setAuthMsg('');
}

// ============================================================
//  AUTH
// ============================================================
async function handleLogin() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass  = document.getElementById('login-pass').value;
  if(!email||!pass) { setAuthMsg('Lütfen tüm alanları doldurun.','error'); return; }

  const btn = document.getElementById('btn-login');
  btn.innerHTML = '<div class="loader"></div>';
  btn.disabled = true;

  try {
    const users = await loadData('users');
    const user = Object.values(users).find(u => u.email===email && u.password===hashPass(pass));
    if(!user) { setAuthMsg('E-posta veya şifre hatalı.','error'); return; }
    currentUser = user;
    localStorage.setItem('poctagram_me', JSON.stringify(user));
    // mark online
    users[user.id].online = true; users[user.id].lastSeen = Date.now();
    await saveData('users', users);
    enterApp();
  } catch(e) {
    setAuthMsg('Bir hata oluştu, tekrar deneyin.','error');
  } finally {
    btn.innerHTML = 'Giriş Yap'; btn.disabled = false;
  }
}

async function handleRegister() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const pass  = document.getElementById('reg-pass').value;
  if(!name||!email||!pass) { setAuthMsg('Lütfen tüm alanları doldurun.','error'); return; }
  if(pass.length<6) { setAuthMsg('Şifre en az 6 karakter olmalı.','error'); return; }

  const btn = document.getElementById('btn-register');
  btn.innerHTML = '<div class="loader"></div>'; btn.disabled = true;

  try {
    const users = await loadData('users');
    if(Object.values(users).find(u=>u.email===email)) {
      setAuthMsg('Bu e-posta zaten kayıtlı.','error'); return;
    }
    const id = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    const user = { id, name, email, password: hashPass(pass), online: true, lastSeen: Date.now(), joined: Date.now() };
    users[id] = user;
    await saveData('users', users);
    currentUser = user;
    localStorage.setItem('poctagram_me', JSON.stringify(user));
    setAuthMsg('Kayıt başarılı! Hoş geldin 🎉','success');
    setTimeout(enterApp, 800);
  } catch(e) {
    setAuthMsg('Bir hata oluştu, tekrar deneyin.','error');
  } finally {
    btn.innerHTML = 'Kayıt Ol'; btn.disabled = false;
  }
}

function handleLogout() {
  // mark offline
  loadData('users').then(users => {
    if(users[currentUser.id]) {
      users[currentUser.id].online = false;
      users[currentUser.id].lastSeen = Date.now();
      saveData('users', users);
    }
  });
  clearInterval(pollInterval);
  currentUser=null; activeContact=null;
  localStorage.removeItem('poctagram_me');
  document.getElementById('screen-app').classList.remove('active');
  document.getElementById('screen-auth').classList.add('active');
  switchTab('login');
  document.getElementById('contacts-list').innerHTML = `<div class="empty-contacts"><svg fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><p>Arama yaparak kullanıcı bulabilirsiniz</p></div>`;
  closeProfile();
  showToast('Çıkış yapıldı');
}

// ============================================================
//  APP ENTRY
// ============================================================
function enterApp() {
  document.getElementById('screen-auth').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');
  document.getElementById('no-chat').style.display='';
  document.getElementById('active-chat').style.display='none';
  startPolling();
}

// ============================================================
//  SEARCH USERS
// ============================================================
async function handleSearch() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  if(!q) {
    renderRecentContacts(); return;
  }
  const users = await loadData('users');
  const results = Object.values(users).filter(u => u.id!==currentUser.id && u.name.toLowerCase().includes(q));
  renderContactItems(results, true);
}

async function renderRecentContacts() {
  const msgs = await loadData('messages');
  const users = await loadData('users');
  allUsers = users; allMessages = msgs;

  // find conversations involving me
  const myConvs = {};
  Object.values(msgs).forEach(m => {
    if(m.from===currentUser.id || m.to===currentUser.id) {
      const other = m.from===currentUser.id ? m.to : m.from;
      if(!myConvs[other] || m.ts > myConvs[other].ts) myConvs[other] = m;
    }
  });

  const contacts = Object.entries(myConvs)
    .sort((a,b)=>b[1].ts-a[1].ts)
    .map(([uid])=>users[uid]).filter(Boolean);

  if(!contacts.length) {
    document.getElementById('contacts-list').innerHTML=`<div class="empty-contacts"><svg fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><p>Arama yaparak kullanıcı bulabilirsiniz</p></div>`;
    return;
  }
  renderContactItems(contacts, false);
}

function renderContactItems(users, isSearch) {
  const msgs = allMessages;
  const list = document.getElementById('contacts-list');
  if(!users.length) {
    list.innerHTML=`<div class="empty-contacts"><svg fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>Kullanıcı bulunamadı</p></div>`;
    return;
  }
  list.innerHTML = users.map(u => {
    const convKey = convId(currentUser.id, u.id);
    const convMsgs = Object.values(msgs).filter(m=>m.conv===convKey).sort((a,b)=>a.ts-b.ts);
    const last = convMsgs[convMsgs.length-1];
    const unread = convMsgs.filter(m=>m.from===u.id && !m.read).length;
    const col = avatarColor(u.name);
    const online = u.online && (Date.now()-u.lastSeen < 90000);
    return `<div class="contact-item ${activeContact?.id===u.id?'active':''}" onclick="openChat('${u.id}')">
      <div class="avatar" style="background:${col}">
        ${initials(u.name)}
        ${online?'<span class="online-dot"></span>':''}
      </div>
      <div class="contact-info">
        <div class="contact-name">${escHtml(u.name)}</div>
        <div class="contact-last">${last ? escHtml(last.text.substring(0,40)) : (isSearch?'Mesaj gönder':'')}</div>
      </div>
      <div class="contact-meta">
        ${last?`<span class="contact-time">${fmtTime(last.ts)}</span>`:''}
        ${unread?`<span class="unread-badge">${unread>9?'9+':unread}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

// ============================================================
//  OPEN CHAT
// ============================================================
async function openChat(uid) {
  const users = await loadData('users');
  activeContact = users[uid];
  if(!activeContact) return;

  document.getElementById('no-chat').style.display='none';
  const ac = document.getElementById('active-chat');
  ac.style.display='flex';

  // mobile
  document.getElementById('chat-area').classList.add('mobile-open');

  // header
  const col = avatarColor(activeContact.name);
  const av = document.getElementById('chat-header-avatar');
  av.style.background=col; av.textContent=initials(activeContact.name);
  document.getElementById('chat-header-name').textContent=activeContact.name;
  const online = activeContact.online && (Date.now()-activeContact.lastSeen<90000);
  document.getElementById('chat-header-status').textContent = online ? 'Çevrimiçi' : 'Son görülme: '+fmtTime(activeContact.lastSeen);

  await renderMessages();
  document.getElementById('msg-input').focus();

  // mark read
  const msgs = await loadData('messages');
  let changed=false;
  Object.values(msgs).forEach(m=>{
    if(m.from===uid && m.to===currentUser.id && !m.read) { m.read=true; changed=true; }
  });
  if(changed) await saveData('messages',msgs);
  renderRecentContacts();
}

function closeChatMobile() {
  document.getElementById('chat-area').classList.remove('mobile-open');
  activeContact=null;
}

// ============================================================
//  MESSAGES
// ============================================================
function convId(a, b) { return [a,b].sort().join('_'); }

async function renderMessages() {
  if(!activeContact) return;
  const msgs = await loadData('messages');
  allMessages = msgs;
  const cid = convId(currentUser.id, activeContact.id);
  const conv = Object.values(msgs).filter(m=>m.conv===cid).sort((a,b)=>a.ts-b.ts);

  const wrap = document.getElementById('messages-wrap');
  if(!conv.length) { wrap.innerHTML='<div style="text-align:center;color:#999;padding:32px;font-size:13px;">Henüz mesaj yok. Merhaba de! 👋</div>'; return; }

  let html='', lastDate='';
  conv.forEach(m=>{
    const d = fmtDate(m.ts);
    if(d!==lastDate) {
      html+=`<div class="date-divider"><span>${d}</span></div>`;
      lastDate=d;
    }
    const isOut = m.from===currentUser.id;
    html+=`<div class="msg-group msg-${isOut?'out':'in'}">
      <div class="msg-bubble">
        ${escHtml(m.text)}
        <div class="msg-meta">
          <span>${fmtTime(m.ts)}</span>
          ${isOut?`<span class="tick"><svg viewBox="0 0 18 18" fill="${m.read?'#53bdeb':'#aaa'}"><path d="M17.394 5.035l-.57-.444a.434.434 0 0 0-.609.076L8.397 13.13l-3.967-3.497a.434.434 0 0 0-.614.029l-.505.545a.434.434 0 0 0 .028.614l4.553 4.017a.434.434 0 0 0 .614-.028l9.056-10.561a.434.434 0 0 0-.168-.214z"/><path d="M12.694 5.035l-.57-.444a.434.434 0 0 0-.609.076L3.697 13.13l-1.967-1.497a.434.434 0 0 0-.614.029l-.505.545a.434.434 0 0 0 .028.614l2.553 2.017a.434.434 0 0 0 .614-.028l9.056-10.561a.434.434 0 0 0-.062-.214z"/></svg></span>`:''}
        </div>
      </div>
    </div>`;
  });
  wrap.innerHTML=html;
  wrap.scrollTop=wrap.scrollHeight;
  lastMsgCount=conv.length;
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text || !activeContact) return;

  input.value=''; autoResize(input);
  playSend();

  const msg = {
    id: 'm_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    conv: convId(currentUser.id, activeContact.id),
    from: currentUser.id,
    to: activeContact.id,
    text, ts: Date.now(), read: false
  };

  const msgs = await loadData('messages');
  msgs[msg.id] = msg;
  await saveData('messages', msgs);
  allMessages = msgs;
  await renderMessages();
  renderRecentContacts();
}

function handleInputKey(e) {
  if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

// ============================================================
//  POLLING (simulated real-time, every 3s)
// ============================================================
function startPolling() {
  renderRecentContacts();
  pollInterval = setInterval(async ()=>{
    const users = await loadData('users');
    // update my online status
    if(users[currentUser.id]) {
      users[currentUser.id].online=true;
      users[currentUser.id].lastSeen=Date.now();
      await saveData('users',users);
    }
    allUsers = users;

    if(activeContact) {
      const msgs = await loadData('messages');
      const cid = convId(currentUser.id, activeContact.id);
      const conv = Object.values(msgs).filter(m=>m.conv===cid).sort((a,b)=>a.ts-b.ts);
      if(conv.length > lastMsgCount) {
        const newMsgs = conv.slice(lastMsgCount);
        const hasIncoming = newMsgs.some(m=>m.from===activeContact.id);
        if(hasIncoming) playReceive();
        await renderMessages();
        // mark read
        let changed=false;
        Object.values(msgs).forEach(m=>{
          if(m.from===activeContact.id && m.to===currentUser.id && !m.read) { m.read=true; changed=true; }
        });
        if(changed) await saveData('messages',msgs);
      }
      // update online status in header
      const c = users[activeContact.id];
      if(c) {
        const online = c.online && (Date.now()-c.lastSeen<90000);
        document.getElementById('chat-header-status').textContent = online ? 'Çevrimiçi' : 'Son görülme: '+fmtTime(c.lastSeen);
      }
    }
    renderRecentContacts();
  }, 3000);
}

// ============================================================
//  PROFILE PANEL
// ============================================================
function openProfile() {
  if(!currentUser) return;
  const col = avatarColor(currentUser.name);
  const av = document.getElementById('profile-avatar-big');
  av.style.background=col; av.textContent=initials(currentUser.name);
  document.getElementById('profile-name-big').textContent=currentUser.name;
  document.getElementById('profile-email-big').textContent=currentUser.email;
  document.getElementById('profile-panel').classList.add('show');
}
function closeProfile() { document.getElementById('profile-panel').classList.remove('show'); }
function closeProfileOutside(e) { if(e.target.id==='profile-panel') closeProfile(); }

// ============================================================
//  HELPERS
// ============================================================
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

// ============================================================
//  INIT
// ============================================================
window.addEventListener('DOMContentLoaded', ()=>{
  if(currentUser) { enterApp(); }
  // press enter to submit forms
  ['login-email','login-pass'].forEach(id=>{
    document.getElementById(id)?.addEventListener('keydown',e=>{ if(e.key==='Enter') handleLogin(); });
  });
  ['reg-name','reg-email','reg-pass'].forEach(id=>{
    document.getElementById(id)?.addEventListener('keydown',e=>{ if(e.key==='Enter') handleRegister(); });
  });

  // mark offline on unload
  window.addEventListener('beforeunload', ()=>{
    if(!currentUser) return;
    const users = JSON.parse(localStorage.getItem('poctagram_users')||'{}');
    if(users[currentUser.id]) {
      users[currentUser.id].online=false;
      users[currentUser.id].lastSeen=Date.now();
      localStorage.setItem('poctagram_users',JSON.stringify(users));
    }
  });
});
