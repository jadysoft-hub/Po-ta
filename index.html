<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Poçtagram</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal-dark: #075E54; --teal-mid: #128C7E; --green: #25D366;
      --bg: #ECE5DD; --white: #FFFFFF; --gray-light: #F0F0F0;
      --gray-mid: #C4C4C4; --gray-dark: #667781; --text: #111B21;
      --bubble-out: #D9FDD3; --bubble-in: #FFFFFF;
      --shadow: rgba(0,0,0,.12);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html, body { height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg); color: var(--text); }

    /* SCREENS */
    .screen { display: none; height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }

    /* AUTH */
    #screen-auth {
      background: linear-gradient(160deg, var(--teal-dark) 0%, var(--teal-mid) 50%, #1a1a2e 100%);
      align-items: center; justify-content: center; padding: 24px;
    }
    .auth-card {
      background: var(--white); border-radius: 20px; padding: 36px 28px;
      width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo svg { width: 64px; height: 64px; }
    .auth-logo h1 { font-size: 26px; font-weight: 700; color: var(--teal-dark); margin-top: 8px; }
    .auth-logo p { font-size: 13px; color: var(--gray-dark); margin-top: 4px; }
    .tab-row { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--gray-mid); margin-bottom: 24px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--gray-dark); transition: all .2s; }
    .tab-btn.active { background: var(--teal-dark); color: var(--white); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-dark); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
    .form-group input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--gray-mid);
      border-radius: 10px; font-size: 15px; outline: none; transition: border-color .2s; font-family: var(--font);
    }
    .form-group input:focus { border-color: var(--teal-mid); }
    .btn-primary {
      width: 100%; padding: 14px; background: var(--green); border: none;
      border-radius: 12px; font-size: 16px; font-weight: 700; color: var(--white);
      cursor: pointer; transition: background .2s; margin-top: 4px;
    }
    .btn-primary:hover { background: #22c35e; }
    .btn-primary:active { transform: scale(.98); }
    .auth-msg { font-size: 13px; text-align: center; margin-top: 14px; min-height: 18px; }
    .auth-msg.error { color: #e74c3c; }
    .auth-msg.success { color: var(--teal-mid); }

    /* APP LAYOUT */
    #screen-app { flex-direction: row; overflow: hidden; }

    /* SIDEBAR */
    #sidebar {
      width: 360px; min-width: 360px; background: var(--white);
      display: flex; flex-direction: column;
      border-right: 1px solid #e0e0e0; height: 100vh;
    }
    .sidebar-header {
      background: var(--teal-dark); color: var(--white);
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
      min-height: 56px; flex-shrink: 0;
    }
    .sidebar-header h2 { font-size: 20px; font-weight: 700; }
    .icon-btn {
      background: none; border: none; color: rgba(255,255,255,.85); cursor: pointer;
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; transition: background .15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.15); }
    .search-box { padding: 8px 12px; background: var(--gray-light); flex-shrink: 0; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
    .search-box input {
      width: 100%; padding: 8px 14px 8px 36px; background: var(--white);
      border: none; border-radius: 20px; font-size: 14px; outline: none; font-family: var(--font);
    }
    .contacts-list { flex: 1; overflow-y: auto; }
    .contacts-list::-webkit-scrollbar { width: 4px; }
    .contacts-list::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 4px; }
    .contact-item {
      display: flex; align-items: center; padding: 10px 16px;
      cursor: pointer; transition: background .15s; border-bottom: 1px solid #f5f5f5; gap: 12px;
    }
    .contact-item:hover { background: var(--gray-light); }
    .contact-item.active { background: #EDF2F7; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: var(--white); flex-shrink: 0; position: relative;
    }
    .avatar-sm { width: 38px; height: 38px; font-size: 14px; }
    .online-dot {
      position: absolute; bottom: 1px; right: 1px; width: 12px; height: 12px;
      background: var(--green); border: 2px solid var(--white); border-radius: 50%;
    }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-last { font-size: 13px; color: var(--gray-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .contact-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .contact-time { font-size: 11px; color: var(--gray-dark); }
    .unread-badge {
      background: var(--green); color: var(--white); border-radius: 50%;
      width: 20px; height: 20px; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .empty-state { padding: 40px 20px; text-align: center; color: var(--gray-dark); }
    .empty-state svg { width: 56px; height: 56px; margin-bottom: 12px; opacity: .35; }
    .empty-state p { font-size: 14px; line-height: 1.5; }

    /* CHAT AREA */
    #chat-area {
      flex: 1; display: flex; flex-direction: column;
      height: 100vh; min-height: 0; background: var(--bg); overflow: hidden;
    }

    /* No chat placeholder */
    #no-chat {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: var(--gray-dark); gap: 16px;
    }
    #no-chat svg { width: 80px; height: 80px; opacity: .25; }
    #no-chat h3 { font-size: 22px; font-weight: 300; color: #41525D; }
    #no-chat p { font-size: 14px; }

    /* Active chat */
    #active-chat {
      display: flex; flex-direction: column;
      width: 100%; height: 100%; min-height: 0; overflow: hidden;
    }

    .chat-header {
      background: var(--teal-dark); color: var(--white); padding: 10px 16px;
      display: flex; align-items: center; gap: 10px; min-height: 56px;
      flex-shrink: 0; box-shadow: 0 1px 3px var(--shadow);
    }
    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-info h3 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-header-info span { font-size: 12px; color: rgba(255,255,255,.75); }
    .back-btn { display: none; flex-shrink: 0; background: none; border: none; color: var(--white); cursor: pointer; padding: 4px 6px 4px 0; }

    .messages-wrap {
      flex: 1; min-height: 0; overflow-y: auto; padding: 12px 12px 8px;
      background-color: var(--bg);
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23000' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
    }
    .messages-wrap::-webkit-scrollbar { width: 4px; }
    .messages-wrap::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 4px; }


    .date-divider { text-align: center; margin: 12px 0; }
    .date-divider span {
      background: rgba(255,255,255,.8); padding: 4px 12px;
      border-radius: 20px; font-size: 12px; color: var(--gray-dark);
      box-shadow: 0 1px 2px var(--shadow);
    }
    .msg-row { display: flex; margin-bottom: 2px; }
    .msg-row.out { justify-content: flex-end; }
    .msg-row.in  { justify-content: flex-start; }
    .msg-bubble {
      max-width: 72%; padding: 7px 10px 5px; border-radius: 8px;
      word-break: break-word; font-size: 14.5px; line-height: 1.4;
      box-shadow: 0 1px 2px var(--shadow); position: relative;
    }
    .msg-row.out .msg-bubble { background: var(--bubble-out); border-bottom-right-radius: 2px; }
    .msg-row.in  .msg-bubble { background: var(--bubble-in);  border-bottom-left-radius: 2px; }
    .msg-meta {
      font-size: 11px; color: var(--gray-dark); margin-top: 3px;
      display: flex; align-items: center; justify-content: flex-end; gap: 3px;
    }
    .tick { display: inline-flex; align-items: center; }
    .tick svg { width: 16px; height: 16px; display: block; }
    /* Gönderildi (tek gri tik) */
    .tick.sent   svg { fill: #aaa; }
    /* İletildi (çift gri tik) */  
    .tick.delivered svg { fill: #aaa; }
    /* Okundu (çift mavi tik) */
    .tick.read   svg { fill: #53bdeb; }

    /* Gönderilirken: 5 kare loading */
    .msg-sending {
      display: flex; align-items: center; gap: 3px; margin-top: 4px; justify-content: flex-end;
    }
    .msg-sending .sq {
      width: 5px; height: 5px; border-radius: 1px; background: var(--teal-mid);
      animation: sqpulse 1s ease-in-out infinite;
      opacity: 0.2;
    }
    .msg-sending .sq:nth-child(1) { animation-delay: 0s; }
    .msg-sending .sq:nth-child(2) { animation-delay: 0.15s; }
    .msg-sending .sq:nth-child(3) { animation-delay: 0.3s; }
    .msg-sending .sq:nth-child(4) { animation-delay: 0.45s; }
    .msg-sending .sq:nth-child(5) { animation-delay: 0.6s; }
    @keyframes sqpulse {
      0%, 100% { opacity: 0.15; transform: scaleY(0.6); }
      50%       { opacity: 1;    transform: scaleY(1); }
    }

    .chat-input-row {
      background: var(--gray-light); padding: 8px 10px;
      display: flex; align-items: flex-end; gap: 8px;
      flex-shrink: 0; border-top: 1px solid #e0e0e0;
      /* Mobilde klavye açıldığında altına yapışık kalır */
      position: sticky; bottom: 0;
    }
    .msg-input {
      flex: 1; min-width: 0; padding: 9px 14px; background: var(--white); border: none;
      border-radius: 22px; font-size: 16px; outline: none; resize: none;
      font-family: var(--font); max-height: 120px; overflow-y: auto; line-height: 1.4;
      /* iOS zoom önle */
      -webkit-text-size-adjust: 100%;
    }
    .send-btn {
      width: 44px; height: 44px; min-width: 44px; border-radius: 50%;
      background: var(--teal-mid); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--white); transition: background .15s; flex-shrink: 0;
    }
    .send-btn:hover { background: var(--teal-dark); }
    .send-btn:active { transform: scale(.9); }

    /* PROFILE PANEL */
    #profile-panel {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 100; display: none; align-items: flex-end; justify-content: center;
    }
    #profile-panel.show { display: flex; }
    .profile-card {
      background: var(--white); border-radius: 20px 20px 0 0; width: 100%;
      max-width: 480px; padding: 28px 24px 36px; position: relative;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .profile-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .profile-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .profile-avatar {
      width: 64px; height: 64px; border-radius: 50%; font-size: 26px; font-weight: 700;
      color: var(--white); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .profile-details h4 { font-size: 18px; font-weight: 700; }
    .profile-details p { font-size: 14px; color: var(--gray-dark); margin-top: 2px; }
    .btn-logout {
      width: 100%; padding: 13px; background: #e74c3c; border: none;
      border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--white);
      cursor: pointer; margin-top: 8px;
    }
    .close-panel {
      position: absolute; top: 16px; right: 16px; background: none; border: none;
      cursor: pointer; color: var(--gray-dark); padding: 4px;
    }

    /* TOAST */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #333; color: var(--white); padding: 10px 20px; border-radius: 20px;
      font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    .loader {
      border: 3px solid rgba(255,255,255,.3); border-top-color: var(--white);
      border-radius: 50%; width: 20px; height: 20px;
      animation: spin .7s linear infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MOBİL ── */
    @media (max-width: 680px) {
      #sidebar { width: 100%; min-width: 0; border-right: none; }

      /* Chat ekranı mobilde tam ekran katman olarak üste çıkar */
      #chat-area {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%; height: 100%;
        /* iOS safe-area desteği */
        height: 100dvh;
        z-index: 50;
        transform: translateX(100%);
        transition: transform .3s cubic-bezier(.4,0,.2,1);
        display: flex; flex-direction: column; overflow: hidden;
      }
      #chat-area.open { transform: translateX(0); }

      /* active-chat mobilde tam dolar */
      #active-chat {
        flex: 1; min-height: 0;
        display: flex; flex-direction: column; overflow: hidden;
      }

      /* Klavye açıldığında mesajlar küçülür, input altta sabit */
      .messages-wrap { flex: 1; min-height: 0; overflow-y: auto; }

      .chat-input-row {
        flex-shrink: 0;
        /* iOS klavye üstünde görünmesi için */
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }

      .back-btn { display: flex !important; }

      /* Baloncuklar mobilde biraz daha geniş */
      .msg-bubble { max-width: 82%; font-size: 15px; }
    }
  </style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="screen active" id="screen-auth">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="32" fill="#075E54"/>
        <path d="M32 10C20.95 10 12 18.95 12 30C12 33.8 13.08 37.34 14.95 40.34L12 52L23.95 49.12C26.82 50.67 30.3 51.6 34 51.6C45.05 51.6 54 42.65 54 31.6C54 20.55 45.05 10 32 10Z" fill="#25D366"/>
        <path d="M44 38.2C43.5 39.5 41.8 40.6 40.3 40.9C39.3 41.1 37.9 41.3 33.2 39.4C27.2 36.9 23.3 30.8 23 30.4C22.7 30 20.6 27.2 20.6 24.3C20.6 21.4 22.1 20 22.7 19.3C23.3 18.6 24 18.5 24.4 18.5C24.8 18.5 25.2 18.5 25.5 18.5C25.9 18.5 26.4 18.4 26.9 19.5C27.4 20.6 28.6 23.5 28.7 23.7C28.9 23.9 29 24.2 28.8 24.5C28.6 24.8 28.5 25 28.3 25.2C28.1 25.4 27.8 25.7 27.6 25.9C27.4 26.1 27.2 26.4 27.4 26.8C27.6 27.2 28.6 28.8 30 30C31.8 31.6 33.3 32.1 33.7 32.3C34.1 32.5 34.4 32.5 34.6 32.2C34.8 31.9 35.8 30.8 36.1 30.4C36.4 30 36.7 30.1 37.1 30.2C37.5 30.3 40.4 31.7 40.8 31.9C41.2 32.1 41.5 32.2 41.6 32.4C41.7 32.7 41.7 34 41.1 35.5C40.5 37 37.3 38.6 36.4 38.7C35.5 38.8 34.7 39.1 31.2 37.8C26.3 36 23.2 31 22.9 30.6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h1>Poçtagram</h1>
      <p>Hızlı ve güvenli mesajlaşma</p>
    </div>
    <div class="tab-row">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Giriş Yap</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Kayıt Ol</button>
    </div>
    <div id="form-login">
      <div class="form-group"><label>E-posta</label><input type="email" id="login-email" placeholder="ornek@mail.com" /></div>
      <div class="form-group"><label>Şifre</label><input type="password" id="login-pass" placeholder="••••••••" /></div>
      <button class="btn-primary" id="btn-login" onclick="handleLogin()">Giriş Yap</button>
    </div>
    <div id="form-register" style="display:none">
      <div class="form-group"><label>İsim</label><input type="text" id="reg-name" placeholder="Adın Soyadın" /></div>
      <div class="form-group"><label>E-posta</label><input type="email" id="reg-email" placeholder="ornek@mail.com" /></div>
      <div class="form-group"><label>Şifre</label><input type="password" id="reg-pass" placeholder="En az 6 karakter" /></div>
      <button class="btn-primary" id="btn-register" onclick="handleRegister()">Kayıt Ol</button>
    </div>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<!-- APP SCREEN -->
<div class="screen" id="screen-app">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>Poçtagram</h2>
      <button class="icon-btn" title="Profil" onclick="openProfile()">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      </button>
    </div>
    <div class="search-box">
      <div class="search-wrap">
        <svg width="16" height="16" fill="none" stroke="#667781" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="İsimle kullanıcı ara..." oninput="handleSearch()" />
      </div>
    </div>
    <div class="contacts-list" id="contacts-list">
      <div class="empty-state">
        <svg fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <p>Arama yaparak<br>kullanıcı bulabilirsiniz</p>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div id="chat-area">

    <!-- No chat selected -->
    <div id="no-chat">
      <svg fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <h3>Poçtagram Web</h3>
      <p>Mesajlaşmak için bir kullanıcı seçin</p>
    </div>

    <!-- Active chat -->
    <div id="active-chat" style="display:none;">
      <div class="chat-header">
        <button class="back-btn" onclick="closeChatMobile()">
          <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="avatar avatar-sm" id="chat-header-avatar"></div>
        <div class="chat-header-info">
          <h3 id="chat-header-name"></h3>
          <span id="chat-header-status"></span>
        </div>
      </div>
      <div class="messages-wrap" id="messages-wrap"></div>
      <div class="chat-input-row">
        <textarea class="msg-input" id="msg-input" placeholder="Mesaj yaz..." rows="1"
          onkeydown="handleInputKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" onclick="sendMessage()">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

  </div>
</div>

<!-- Profile Panel -->
<div id="profile-panel" onclick="closeProfileOutside(event)">
  <div class="profile-card">
    <button class="close-panel" onclick="closeProfile()">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <h3>Profilim</h3>
    <div class="profile-row">
      <div class="profile-avatar" id="profile-avatar-big"></div>
      <div class="profile-details">
        <h4 id="profile-name-big"></h4>
        <p id="profile-email-big"></p>
      </div>
    </div>
    <button class="btn-logout" onclick="handleLogout()">Çıkış Yap</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════════════════════════════
//  CONFIG — jsonbin.io ücretsiz hesap aç, Master Key al
// ════════════════════════════════════════════════════════
const JSONBIN_KEY  = '$2a$10$JGOBHlKcxZkUbNs5cdk94.hBGlx6vtDMYI5uf0iAzSWlqSlS.J8UW';
const JSONBIN_BASE = 'https://api.jsonbin.io/v3';

// ════════════════════════════════════════════════════════
//  DATA LAYER  (JSONBin yoksa localStorage fallback)
// ════════════════════════════════════════════════════════
const useCloud = !JSONBIN_KEY.includes('6a207ea1f5f4af5e29b43274  ');
let   BIN_IDS  = JSON.parse(localStorage.getItem('ptg_bins') || '{}');
const _cache   = { users: {}, msgs: {} };

async function getBinId(key) {
  if (BIN_IDS[key]) return BIN_IDS[key];
  const r = await fetch(`${JSONBIN_BASE}/b`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_KEY,
               'X-Bin-Name': 'ptg_' + key, 'X-Bin-Private': 'false' },
    body: JSON.stringify({})
  });
  if (!r.ok) throw new Error('bin error');
  const d = await r.json();
  BIN_IDS[key] = d.metadata.id;
  localStorage.setItem('ptg_bins', JSON.stringify(BIN_IDS));
  return BIN_IDS[key];
}

async function loadData(key) {
  if (!useCloud) {
    const raw = localStorage.getItem('ptg_' + key);
    _cache[key] = raw ? JSON.parse(raw) : {};
    return _cache[key];
  }
  try {
    const id  = await getBinId(key);
    const r   = await fetch(`${JSONBIN_BASE}/b/${id}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if (!r.ok) return _cache[key];
    const d = await r.json();
    _cache[key] = d.record || {};
    return _cache[key];
  } catch { return _cache[key]; }
}

async function saveData(key, data) {
  _cache[key] = data;
  if (!useCloud) {
    localStorage.setItem('ptg_' + key, JSON.stringify(data));
    return;
  }
  try {
    const id = await getBinId(key);
    await fetch(`${JSONBIN_BASE}/b/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify(data)
    });
  } catch(e) { console.warn('save error', e); }
}

// ════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════
let currentUser   = null;
let activeContact = null;
let pollTimer     = null;
let lastMsgCount  = 0;
let searchMode    = false;

// ════════════════════════════════════════════════════════
//  AUDIO
// ════════════════════════════════════════════════════════
let _actx;
function ac() { if (!_actx) _actx = new (window.AudioContext||window.webkitAudioContext)(); return _actx; }
function playSend() {
  try {
    const c=ac(), now=c.currentTime;
    // Kısa "fwoosh" sesi — gönderim
    const o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type='sine';
    o.frequency.setValueAtTime(440, now);
    o.frequency.exponentialRampToValueAtTime(880, now+0.08);
    o.frequency.exponentialRampToValueAtTime(1760, now+0.15);
    g.gain.setValueAtTime(0.0, now);
    g.gain.linearRampToValueAtTime(0.22, now+0.04);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.18);
    o.start(now); o.stop(now+0.2);
  } catch(e) {}
}
function playRecv() {
  try {
    const c=ac(), now=c.currentTime;
    // İki nota: WhatsApp benzeri ding-dong
    [0, 0.12].forEach((delay, i) => {
      const o=c.createOscillator(), g=c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type='sine';
      o.frequency.value = i===0 ? 880 : 1047;
      g.gain.setValueAtTime(0.0, now+delay);
      g.gain.linearRampToValueAtTime(0.2, now+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now+delay+0.22);
      o.start(now+delay); o.stop(now+delay+0.25);
    });
  } catch(e) {}
}

// ════════════════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════════════════
const COLORS=['#075E54','#128C7E','#e67e22','#9b59b6','#e74c3c','#2980b9','#16a085','#8e44ad'];
function avatarColor(n){ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))%COLORS.length; return COLORS[h]; }
function initials(n){ return n.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(ts){
  const d=new Date(ts),now=new Date();
  if(d.toDateString()===now.toDateString()) return 'Bugün';
  const y=new Date(now); y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString()) return 'Dün';
  return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function hashPass(p){ let h=5381; for(const c of p) h=((h<<5)+h+c.charCodeAt(0))|0; return h.toString(36); }
function convId(a,b){ return [a,b].sort().join('__'); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function setAuthMsg(msg,type=''){ const el=document.getElementById('auth-msg'); el.textContent=msg; el.className='auth-msg '+type; }
function showChat(show){
  document.getElementById('no-chat').style.display     = show ? 'none' : 'flex';
  document.getElementById('active-chat').style.display = show ? 'flex' : 'none';
}
function setLoading(btnId, loading, label){
  const b=document.getElementById(btnId);
  b.disabled=loading; b.innerHTML=loading?'<div class="loader"></div>':label;
}

// ════════════════════════════════════════════════════════
//  TAB
// ════════════════════════════════════════════════════════
function switchTab(tab){
  document.getElementById('form-login').style.display    = tab==='login'    ? '' : 'none';
  document.getElementById('form-register').style.display = tab==='register' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active',    tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  setAuthMsg('');
}

// ════════════════════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════════════════════
async function handleLogin(){
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass  = document.getElementById('login-pass').value;
  if(!email||!pass){ setAuthMsg('Tüm alanları doldurun.','error'); return; }

  setLoading('btn-login', true, 'Giriş Yap');
  try {
    const users = await loadData('users');
    const user  = Object.values(users).find(u => u.email===email && u.password===hashPass(pass));
    if(!user){ setAuthMsg('E-posta veya şifre hatalı.','error'); return; }

    users[user.id].online   = true;
    users[user.id].lastSeen = Date.now();
    await saveData('users', users);

    currentUser = users[user.id];
    localStorage.setItem('ptg_me', JSON.stringify(currentUser));
    enterApp();
  } catch(e){
    setAuthMsg('Bağlantı hatası, tekrar dene.','error');
  } finally {
    setLoading('btn-login', false, 'Giriş Yap');
  }
}

async function handleRegister(){
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const pass  = document.getElementById('reg-pass').value;
  if(!name||!email||!pass){ setAuthMsg('Tüm alanları doldurun.','error'); return; }
  if(pass.length<6){ setAuthMsg('Şifre en az 6 karakter.','error'); return; }

  setLoading('btn-register', true, 'Kayıt Ol');
  try {
    const users = await loadData('users');
    if(Object.values(users).find(u => u.email===email)){
      setAuthMsg('Bu e-posta zaten kayıtlı.','error'); return;
    }
    const id   = 'u' + Date.now() + Math.random().toString(36).slice(2,6);
    const user = { id, name, email, password: hashPass(pass), online: true, lastSeen: Date.now() };
    users[id]  = user;
    await saveData('users', users);

    currentUser = user;
    localStorage.setItem('ptg_me', JSON.stringify(currentUser));
    setAuthMsg('Kayıt başarılı! Hoş geldin 🎉','success');
    setTimeout(enterApp, 600);
  } catch(e){
    setAuthMsg('Bağlantı hatası, tekrar dene.','error');
  } finally {
    setLoading('btn-register', false, 'Kayıt Ol');
  }
}

async function handleLogout(){
  try {
    const users = await loadData('users');
    if(users[currentUser.id]){
      users[currentUser.id].online   = false;
      users[currentUser.id].lastSeen = Date.now();
      await saveData('users', users);
    }
  } catch(e){}
  clearInterval(pollTimer);
  currentUser=null; activeContact=null;
  localStorage.removeItem('ptg_me');
  closeProfile(); showChat(false);
  document.getElementById('search-input').value='';
  document.getElementById('contacts-list').innerHTML = emptyStateHTML('search');
  document.getElementById('screen-app').classList.remove('active');
  document.getElementById('screen-auth').classList.add('active');
  switchTab('login');
  showToast('Çıkış yapıldı');
}

// ════════════════════════════════════════════════════════
//  APP
// ════════════════════════════════════════════════════════
function enterApp(){
  document.getElementById('screen-auth').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');
  showChat(false);
  refreshSidebar();
  startPolling();
}

// ════════════════════════════════════════════════════════
//  SIDEBAR
// ════════════════════════════════════════════════════════
function emptyStateHTML(type){
  if(type==='search') return `<div class="empty-state"><svg fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><p>Arama yaparak<br>kullanıcı bulabilirsiniz</p></div>`;
  return `<div class="empty-state"><svg fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>Kullanıcı bulunamadı</p></div>`;
}

async function refreshSidebar(){
  if(searchMode) return;
  const [users, msgs] = await Promise.all([loadData('users'), loadData('msgs')]);
  const seen = {};
  Object.values(msgs).forEach(m => {
    if(m.from===currentUser.id || m.to===currentUser.id){
      const other = m.from===currentUser.id ? m.to : m.from;
      if(!seen[other] || m.ts>seen[other]) seen[other]=m.ts;
    }
  });
  const contacts = Object.keys(seen).sort((a,b)=>seen[b]-seen[a]).map(uid=>users[uid]).filter(Boolean);
  if(!contacts.length){ document.getElementById('contacts-list').innerHTML=emptyStateHTML('search'); return; }
  renderContactList(contacts, msgs);
}

function renderContactList(users, msgs){
  if(!msgs) msgs=_cache.msgs||{};
  const list=document.getElementById('contacts-list');
  if(!users.length){ list.innerHTML=emptyStateHTML('none'); return; }
  list.innerHTML = users.map(u => {
    const cid   = convId(currentUser.id, u.id);
    const conv  = Object.values(msgs).filter(m=>m.conv===cid).sort((a,b)=>a.ts-b.ts);
    const last  = conv[conv.length-1];
    const unread= conv.filter(m=>m.from===u.id&&!m.read).length;
    const col   = avatarColor(u.name);
    const online= u.online&&(Date.now()-u.lastSeen<90000);
    const active= activeContact&&activeContact.id===u.id;
    return `<div class="contact-item${active?' active':''}" onclick="openChat('${u.id}')">
      <div class="avatar" style="background:${col}">${initials(u.name)}${online?'<span class="online-dot"></span>':''}</div>
      <div class="contact-info">
        <div class="contact-name">${esc(u.name)}</div>
        <div class="contact-last">${last?esc(last.text.slice(0,45)):'<span style="color:#aaa">Mesaj gönder</span>'}</div>
      </div>
      <div class="contact-meta">
        ${last?`<span class="contact-time">${fmtTime(last.ts)}</span>`:''}
        ${unread?`<span class="unread-badge">${unread>9?'9+':unread}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════════
//  SEARCH
// ════════════════════════════════════════════════════════
async function handleSearch(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  if(!q){ searchMode=false; refreshSidebar(); return; }
  searchMode=true;
  const users   = await loadData('users');
  const results = Object.values(users).filter(u => u.id!==currentUser.id && u.name.toLowerCase().includes(q));
  renderContactList(results);
}

// ════════════════════════════════════════════════════════
//  OPEN / CLOSE CHAT
// ════════════════════════════════════════════════════════
async function openChat(uid){
  const users = await loadData('users');
  if(!users[uid]) return;
  activeContact = users[uid];

  document.getElementById('search-input').value='';
  searchMode=false;

  showChat(true);
  document.getElementById('chat-area').classList.add('open');

  const col=avatarColor(activeContact.name);
  const av=document.getElementById('chat-header-avatar');
  av.style.background=col; av.textContent=initials(activeContact.name);
  document.getElementById('chat-header-name').textContent=activeContact.name;
  const online=activeContact.online&&(Date.now()-activeContact.lastSeen<90000);
  document.getElementById('chat-header-status').textContent=online?'Çevrimiçi':'Son görülme: '+fmtTime(activeContact.lastSeen);

  await renderMessages();
  markRead(uid);
  refreshSidebar();
  setTimeout(()=>document.getElementById('msg-input').focus(),150);
}

function closeChatMobile(){
  document.getElementById('chat-area').classList.remove('open');
  showChat(false);
  activeContact=null;
  refreshSidebar();
}

// ════════════════════════════════════════════════════════
//  MESSAGES
// ════════════════════════════════════════════════════════
async function renderMessages(){
  if(!activeContact) return;
  const msgs = await loadData('msgs');
  const cid  = convId(currentUser.id, activeContact.id);
  const conv = Object.values(msgs).filter(m=>m.conv===cid).sort((a,b)=>a.ts-b.ts);
  const wrap = document.getElementById('messages-wrap');
  if(!conv.length){
    wrap.innerHTML='<div style="text-align:center;color:#aaa;padding:40px 20px;font-size:13px;">Henüz mesaj yok 👋</div>';
    lastMsgCount=0; return;
  }
  let html='', lastDate='';
  conv.forEach(m=>{
    const d=fmtDate(m.ts);
    if(d!==lastDate){ html+=`<div class="date-divider"><span>${d}</span></div>`; lastDate=d; }
    const out=m.from===currentUser.id;
    // Tick durumu: sending (geçici), sent/delivered/read
    let tickHTML='';
    if(out){
      const status = m.status||'delivered'; // sending | sent | delivered | read
      if(status==='sending'){
        tickHTML=`<span class="msg-sending"><span class="sq"></span><span class="sq"></span><span class="sq"></span><span class="sq"></span><span class="sq"></span></span>`;
      } else if(status==='sent'){
        // Tek tik (gönderildi, sunucuya ulaştı)
        tickHTML=`<span class="tick sent"><svg viewBox="0 0 18 18"><path fill="#aaa" d="M17.394 5.035l-.57-.444a.434.434 0 0 0-.609.076L8.397 13.13l-3.967-3.497a.434.434 0 0 0-.614.029l-.505.545a.434.434 0 0 0 .028.614l4.553 4.017a.434.434 0 0 0 .614-.028l9.056-10.561a.434.434 0 0 0-.168-.214z"/></svg></span>`;
      } else if(m.read){
        // Çift mavi tik (okundu)
        tickHTML=`<span class="tick read"><svg viewBox="0 0 18 18"><path fill="#53bdeb" d="M17.394 5.035l-.57-.444a.434.434 0 0 0-.609.076L8.397 13.13l-3.967-3.497a.434.434 0 0 0-.614.029l-.505.545a.434.434 0 0 0 .028.614l4.553 4.017a.434.434 0 0 0 .614-.028l9.056-10.561a.434.434 0 0 0-.168-.214z"/><path fill="#53bdeb" d="M12.694 5.035l-.57-.444a.434.434 0 0 0-.609.076L3.697 13.13l-1.967-1.497a.434.434 0 0 0-.614.029l-.505.545a.434.434 0 0 0 .028.614l2.553 2.017a.434.434 0 0 0 .614-.028l9.056-10.561a.434.434 0 0 0-.062-.214z"/></svg></span>`;
      } else {
        // Çift gri tik (iletildi, okunmadı)
        tickHTML=`<span class="tick delivered"><svg viewBox="0 0 18 18"><path fill="#aaa" d="M17.394 5.035l-.57-.444a.434.434 0 0 0-.609.076L8.397 13.13l-3.967-3.497a.434.434 0 0 0-.614.029l-.505.545a.434.434 0 0 0 .028.614l4.553 4.017a.434.434 0 0 0 .614-.028l9.056-10.561a.434.434 0 0 0-.168-.214z"/><path fill="#aaa" d="M12.694 5.035l-.57-.444a.434.434 0 0 0-.609.076L3.697 13.13l-1.967-1.497a.434.434 0 0 0-.614.029l-.505.545a.434.434 0 0 0 .028.614l2.553 2.017a.434.434 0 0 0 .614-.028l9.056-10.561a.434.434 0 0 0-.062-.214z"/></svg></span>`;
      }
    }
    html+=`<div class="msg-row ${out?'out':'in'}" data-id="${m.id}"><div class="msg-bubble">${esc(m.text)}<div class="msg-meta"><span>${fmtTime(m.ts)}</span>${tickHTML}</div></div></div>`;
  });
  wrap.innerHTML=html; wrap.scrollTop=wrap.scrollHeight; lastMsgCount=conv.length;
}

async function markRead(fromUid){
  const msgs=await loadData('msgs'); let changed=false;
  Object.values(msgs).forEach(m=>{
    if(m.from===fromUid&&m.to===currentUser.id&&!m.read){ m.read=true; changed=true; }
  });
  if(changed){
    _cache.msgs=msgs;
    saveData('msgs',msgs); // fire & forget
    // Karşı tarafın mesajları okundu — render güncelle (gri → mavi tik)
    if(activeContact && activeContact.id===fromUid) renderMessages();
  }
}

async function sendMessage(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text||!activeContact) return;
  input.value=''; autoResize(input); playSend();

  const msgId='m'+Date.now()+Math.random().toString(36).slice(2,5);
  const msg={
    id: msgId,
    conv: convId(currentUser.id, activeContact.id),
    from: currentUser.id, to: activeContact.id,
    text, ts: Date.now(), read: false, status: 'sending'
  };

  // Anında UI'a ekle — "sending" (5 kare loader)
  if(!_cache.msgs) _cache.msgs={};
  _cache.msgs[msgId]=msg;
  await renderMessages();
  refreshSidebar();

  // JSONBin'e kaydet
  try {
    const msgs = await loadData('msgs');
    msgs[msgId] = { ...msg, status: 'sent' };
    await saveData('msgs', msgs);
    // Kaydedildi → "sent" (tek tik) göster
    _cache.msgs[msgId].status = 'sent';
    await renderMessages();
  } catch(e) {
    // Hata olsa da mesaj cache'de kalır
    console.warn('Mesaj kaydedilemedi', e);
  }
}

function handleInputKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } }
function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }

// ════════════════════════════════════════════════════════
//  POLLING
// ════════════════════════════════════════════════════════
function startPolling(){
  pollTimer = setInterval(async ()=>{
    try {
      // Online durumu güncelle (fire & forget)
      const users=_cache.users||{};
      if(users[currentUser.id]){
        users[currentUser.id].online=true; users[currentUser.id].lastSeen=Date.now();
        saveData('users',users);
      }
      // Sidebar
      if(!searchMode) refreshSidebar();
      // Aktif sohbet
      if(activeContact){
        const msgs=await loadData('msgs');
        const cid=convId(currentUser.id,activeContact.id);
        const conv=Object.values(msgs).filter(m=>m.conv===cid);
        if(conv.length>lastMsgCount){
          const newOnes=conv.sort((a,b)=>a.ts-b.ts).slice(lastMsgCount);
          if(newOnes.some(m=>m.from===activeContact.id)) playRecv();
          await renderMessages(); markRead(activeContact.id);
        }
        // Header online durumu
        const allUsers=await loadData('users');
        const cu=allUsers[activeContact.id];
        if(cu){ const on=cu.online&&(Date.now()-cu.lastSeen<90000); document.getElementById('chat-header-status').textContent=on?'Çevrimiçi':'Son görülme: '+fmtTime(cu.lastSeen); }
      }
    } catch(e){}
  }, 4000);
}

// ════════════════════════════════════════════════════════
//  PROFILE
// ════════════════════════════════════════════════════════
function openProfile(){
  if(!currentUser) return;
  const col=avatarColor(currentUser.name);
  const av=document.getElementById('profile-avatar-big');
  av.style.background=col; av.textContent=initials(currentUser.name);
  document.getElementById('profile-name-big').textContent=currentUser.name;
  document.getElementById('profile-email-big').textContent=currentUser.email;
  document.getElementById('profile-panel').classList.add('show');
}
function closeProfile(){ document.getElementById('profile-panel').classList.remove('show'); }
function closeProfileOutside(e){ if(e.target.id==='profile-panel') closeProfile(); }

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', ()=>{
  // API key uyarısı
  if(!useCloud){
    document.body.insertAdjacentHTML('beforeend',
      `<div id="cloud-warn" style="position:fixed;top:0;left:0;right:0;background:#e67e22;color:#fff;text-align:center;padding:9px 12px;font-size:13px;z-index:9999;">
        ⚠️ JSONBin API Key girilmedi — veriler <b>sadece bu tarayıcıda</b> saklanıyor. Farklı cihazlardan giriş için
        <a href="https://jsonbin.io" target="_blank" style="color:#fff;font-weight:700;text-decoration:underline;">jsonbin.io</a>'dan key al ve index.html'e yaz.
        <button onclick="document.getElementById('cloud-warn').remove()" style="margin-left:12px;background:rgba(255,255,255,.25);border:none;color:#fff;padding:2px 10px;border-radius:10px;cursor:pointer;">✕</button>
      </div>`
    );
  }

  // Oturum devam ediyorsa direkt gir
  const saved=localStorage.getItem('ptg_me');
  if(saved){ try{ currentUser=JSON.parse(saved); enterApp(); }catch{ localStorage.removeItem('ptg_me'); } }

  // Enter tuşları
  ['login-email','login-pass'].forEach(id => document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') handleLogin(); }));
  ['reg-name','reg-email','reg-pass'].forEach(id => document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') handleRegister(); }));

  // Çıkarken offline yap
  window.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden'&&currentUser){
      const u=_cache.users||{}; if(u[currentUser.id]){ u[currentUser.id].online=false; u[currentUser.id].lastSeen=Date.now(); saveData('users',u); }
    }
  });
});
</script>
</body>
</html>
